<!doctype html>
<!--
  Исходник картинки для соцсетей (public/og.png, 1200×630).
  PNG лежит в репозитории и собирается руками, когда меняется знак или подпись:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png tools/og.html

  Цвета — тёмная тема из src/styles/tokens.css, шрифты — из src/fonts/.
  Слоган и заявление о независимости должны дословно совпадать с src/lib/site.ts:
  это сверяет tools/check-copy.mjs.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        src: url("../src/fonts/ibm-plex-sans/ibm-plex-sans-400n-cyrillic.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        src: url("../src/fonts/ibm-plex-sans/ibm-plex-sans-400n-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 700;
        src: url("../src/fonts/ibm-plex-sans/ibm-plex-sans-700n-cyrillic.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 700;
        src: url("../src/fonts/ibm-plex-sans/ibm-plex-sans-700n-latin.woff2") format("woff2");
      }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #24273a;
        color: #cad3f5;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .logo { display: flex; align-items: center; gap: 28px; font-size: 76px; font-weight: 700; letter-spacing: -0.01em; }
      .logo svg { width: 112px; height: 112px; }
      .dot { color: #7dc4e4; }
      .tld { font-weight: 400; color: #a5adcb; }
      h1 { margin: 0; max-width: 14ch; font-size: 84px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
      h1 em { font-style: normal; color: #7dc4e4; }
      p { margin: 0; max-width: 30em; color: #a5adcb; font-size: 28px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none">
        <g transform="rotate(-90 16 16)" stroke-width="3">
          <circle cx="16" cy="16" r="13" pathLength="100" stroke="#cad3f5" stroke-dasharray="85 15" />
          <circle cx="16" cy="16" r="13" pathLength="100" stroke="#7dc4e4" stroke-dasharray="10 90" stroke-dashoffset="-87.5" />
        </g>
        <circle cx="16" cy="16" r="6.5" stroke="#cad3f5" stroke-width="3" />
        <circle cx="16" cy="16" r="1.75" fill="#7dc4e4" />
      </svg>
      <span>sre<span class="dot">.</span><span class="tld">moscow</span></span>
    </div>
    <h1>Где говорят про <em>надёжность</em></h1>
    <p>Независимое сообщество инженеров. Не принадлежит ни одной компании и никем не спонсируется.</p>
  </body>
</html>
