# Профиль человека, к которому можно обращаться.
# Только свой или с явного согласия человека — см. CRITERIA.md.
# Скопируй файл в data/people/<slug>.yaml, заполни и удали эти комментарии.
# <slug> — имя латиницей: ivan-petrov.yaml

name: Имя Фамилия

# Фото — по желанию. Ссылка на картинку, которой управляешь ты сам: подойдёт
# аватар GitHub. Сайт скачивает её при сборке, уменьшает и раздаёт со своего
# адреса. Без этой строки в профиле стоят инициалы.
# photo: https://github.com/example.png

# Чем занимаешься, до 300 символов. Конкретно: что эксплуатируешь, чем можешь помочь.
bio: Занимаюсь надёжностью платёжного шлюза, веду on-call из шести человек.

# Темы, по которым к тебе стоит идти, — только id из data/topics.yaml.
topics: [incidents, postmortems]

# Контакты — те, по которым ты готов отвечать. Хотя бы один.
# Допустимые ключи: telegram, github, linkedin, mastodon, youtube, site
links:
  telegram: https://t.me/example
  github: https://github.com/example

# Зачем обращаться: questions — можно спросить, mentoring — менторишь,
# speaking — выступаешь. Список можно оставить пустым: []
open_to: [questions, speaking]

# Согласие на публикацию — без него профиль не собирается.
#   by   — self, если PR открыл ты сам; иначе GitHub-логин куратора,
#          которому человек лично подтвердил согласие
#   date — когда согласие получено
consent:
  by: self
  date: 2026-01-15
