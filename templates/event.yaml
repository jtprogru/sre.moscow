# Конференция или митап с датой.
# Скопируй файл в data/events/<гггг-мм>-<slug>.yaml, заполни и удали эти комментарии.
# Год и месяц в имени — от даты начала: 2026-11-sre-meetup-moscow.yaml

# Название так, как оно написано на странице события.
title: Название события

# Начало. Два варианта:
#   дата, если время неизвестно или событие идёт весь день: 2026-11-05
#   дата и время со смещением, обязательно в кавычках: "2026-11-05T19:00:00+03:00"
# Время — местное для события, +03:00 — Москва.
start: "2026-11-05T19:00:00+03:00"

# Конец — в том же виде. Можно не указывать: тогда событие считается
# однодневным.
end: "2026-11-05T22:00:00+03:00"

# Формат: offline, online, hybrid
format: offline

# Город обязателен для offline и hybrid. Страна — двухбуквенный код: RU, KZ, DE.
city: Москва
country: RU

# Язык докладов: ru или en
lang: ru

# Страница именно этого события, а не главная организатора.
url: https://example.org/events/sre-meetup

# Кто проводит. name — как на странице события. ref — имя файла из
# data/organizers/ без .yaml; строку можно убрать, если карточки организатора нет.
organizer:
  name: Название организатора
  ref: example-org

# Приём заявок на доклады. Блок можно убрать целиком, если CFP нет.
cfp:
  url: https://example.org/cfp
  deadline: 2026-10-01

# Участие: free или paid
price: free

# Темы — только id из data/topics.yaml, хотя бы одна.
topics: [incidents]

# Серия, если это очередной выпуск регулярного митапа или конференции.
# Строку можно убрать.
series: Название серии

# Разборы — тексты участников о том, что было на событии. У события, которое
# ещё не началось, их быть не может, поэтому блок закомментирован: раскомментируй
# его, когда дописываешь разбор к прошедшему событию. Что подходит — в CRITERIA.md.
#   title — заголовок текста, как на его странице.
#   author.name — подпись автора оттуда же: имя, ник или название блога.
#   author.person — имя файла из data/people/ без .yaml; строку можно убрать,
#   если профиля у автора нет. Заводить профиль ради разбора не нужно.
# recaps:
#   - title: Что я унёс с SRE-митапа
#     url: https://example.org/blog/sre-meetup-recap
#     author:
#       name: Имя Фамилия
#       person: ivan-petrov

# Сегодняшняя дата: по ней запись попадает в RSS.
added: 2026-01-15
