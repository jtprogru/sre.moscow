# Компания или организатор, который проводит события про надёжность.
# Скопируй файл в data/organizers/<slug>.yaml, заполни и удали эти комментарии.
# Размещение бесплатное и не продаётся — см. CRITERIA.md.

# Название так, как организатор называет себя сам.
name: Название организатора

# Кто это: company, conference-organizer, community
kind: company

# Где за ним следить. Виды ссылок:
#   events        — страница с расписанием или анонсами событий (обязательна)
#   recordings    — записи докладов
#   announcements — канал или рассылка с анонсами
#   cfp           — приём заявок на доклады
# label — своя подпись вместо стандартной, строку можно убрать.
# Каждую ссылку открой перед добавлением: адрес не восстанавливается по названию.
links:
  - kind: events
    url: https://example.org/events
  - kind: recordings
    url: https://www.youtube.com/@example
    label: YouTube-канал

# Серии, по которым его события узнают. Список можно убрать целиком.
# cadence — как часто: «раз в квартал», «ежегодно, осень».
series:
  - name: Example SRE Meetup
    url: https://example.org/meetup
    cadence: раз в квартал

# В каких форматах проводит: offline, online, hybrid
formats: [offline, online]

# Города очных событий. Список можно убрать, если всё онлайн.
cities: [Москва]

# Основной язык событий: ru или en
lang: ru

# Темы — только id из data/topics.yaml, хотя бы одна.
topics: [incidents, observability]

# Одна фраза, до 200 символов: зачем за ним следить.
why: Раз в квартал собирает практиков с разборами реальных инцидентов, записи выкладывает открыто.

# Состояние: active — проводит события, quiet — давно ничего не было, archived — больше не проводит.
status: active

# added — сегодняшняя дата. verified — когда ссылки последний раз открывали
# и сверяли; при добавлении совпадает с added.
added: 2026-01-15
verified: 2026-01-15
