# Доклад с открытой записью.
# Скопируй файл в data/talks/<год>-<slug>.yaml, заполни и удали эти комментарии.
# Год в имени — год доклада: 2025-slo-without-illusions.yaml

# Название доклада так, как оно объявлено.
title: Название доклада

# Спикеры. name — как на странице доклада. person — имя файла из data/people/
# без .yaml: указывай, только если у человека уже есть профиль. Доклад
# добавляется и без профиля — строку person тогда убери.
speakers:
  - name: Имя Фамилия
    person: example-person

# Где прозвучал. Для выпуска подкаста — название подкаста с номером выпуска.
# ref — имя файла из data/events/ без .yaml; строку можно убрать, если
# события нет в календаре.
event:
  name: Название конференции или митапа
  ref: 2025-05-example-conf

# Дата доклада.
date: 2025-05-20

# Язык доклада: ru или en
lang: ru

# Страница с записью. Открой её и убедись, что это тот самый доклад.
video: https://example.org/video
# Слайды — строку можно убрать.
slides: https://example.org/slides.pdf

# Темы — только id из data/topics.yaml, хотя бы одна.
topics: [slo]

# Кому: intro — начинающим, practitioner — практикам, advanced — опытным
level: practitioner

# Одна фраза, до 200 символов: зачем это смотреть. Не пересказ аннотации,
# а твой ответ коллеге на вопрос «а что там полезного?».
why: Показывает на живых цифрах, как выбрать SLI, когда метрик уже сотни.

# Сегодняшняя дата: по ней запись попадает в RSS.
added: 2026-01-15
